# ETAP 2a: wersja ROBOCZA 30 s 16:9 na animatiku 640x360 (ocena timingu, jakosc obrazu nieistotna).
#   python3 edit.py configs/robocza_30s_16x9.yaml --keep-work [--resume]
# Pasek z ID ujecia/klatka z animatiku jest przenoszony 1:1 (strip) - napisy i plansza go nie zaslaniaja.
work_dir: ../test/work_robocza
versions:
  RYTM_robocza_30s_16x9:
    size: [960, 540]
    fps: 25
    strip: {crop: [0, 0, 640, 21], scale: 3.0, pos: [0, 0]}
    shots:
      - {id: S01, src: ../../renders/animatic/RYTM_animatic_640x360.mp4, f: [0, 60]}
      - {id: S02, src: ../../renders/animatic/RYTM_animatic_640x360.mp4, f: [60, 180]}
      - {id: S03, src: ../../renders/animatic/RYTM_animatic_640x360.mp4, f: [180, 225]}
      - {id: S04, src: ../../renders/animatic/RYTM_animatic_640x360.mp4, f: [225, 300]}
      - {id: S05, src: ../../renders/animatic/RYTM_animatic_640x360.mp4, f: [300, 345]}
      - {id: S06, src: ../../renders/animatic/RYTM_animatic_640x360.mp4, f: [345, 420]}
      - {id: S07, src: ../../renders/animatic/RYTM_animatic_640x360.mp4, f: [420, 480]}
      - {id: S08, src: ../../renders/animatic/RYTM_animatic_640x360.mp4, f: [480, 600]}
      - {id: S09, src: ../../renders/animatic/RYTM_animatic_640x360.mp4, f: [600, 670]}   # +10 kl. pod przenikanie
      - id: S10
        type: endcard
        dur_f: 90
        f: [660, 750]
        bg: "#EFEAE2"
        transition: {type: dissolve, frames: 10}
        strip_from: {src: ../../renders/animatic/RYTM_animatic_640x360.mp4, f: [660, 750]}
        elements:
          - {type: glyph, model: ../../data/model.json, height: 240, cx: 960, cy: 380, stroke: 2, f: [2, 32]}
          - {type: text, text: RYTM, style: end_name, y: 600, f: [12, 26]}
          - {type: text, text: "Precyzja w każdej warstwie.", style: end_tag, y: 690, f: [24, 38]}
          - {type: text, text: "Regał ze sklejki brzozowej · 190 × 202 × 40 cm", style: end_desc, y: 750, f: [30, 42]}
          - {type: text, text: "CNC Furniture Studio", style: end_brand, y: 980, f: [36, 48]}
    titles:
      - {text: "Bez boków.", style: title, x: 144, y: 470, f: [96, 176]}
      - {text: "Pełny wysuw.", style: title, x: 144, y: 900, f: [196, 224]}
      - {text: "Cichy domyk.", style: title, x: 144, y: 540, f: [262, 296]}
      - {text: "140 elementów. 8 arkuszy.", style: title, x: 144, y: 960, f: [428, 474], glow: true}
    dims:                                   # punkty 2D per klatka z events.json -> callouts_S06
      - {text: "18 mm", track: A_18mm, label: above, f: [360, 416]}
      - {text: "2 mm", track: B_2mm, label: right, f: [375, 406]}
      - {text: "13 warstw", track: C_13warstw, label: leader, f: [390, 416]}
    grade: {lut: auto, vignette: 0.09, grain: 0}
    audio:
      music: {stems_dir: ../music/synth_v1_stems, use: [pads, groove_marimba, drums, bass, fx, reverb], lufs: -18}
      event_notes: true          # shelf_pass, ladowania polek, fronty, akord f585, sting RYTM - z events.json
      event_music_fx: false      # reveal/riser sa w stemie fx syntezy
      events: ../../renders/events.json
      sfx:                       # akcenty na cieciach bez innego akcentu (f225, f345 = 4. cwiercnuty taktow 4 i 6)
        - {synth: air, params: {duration: 0.7, peak_at: 0.85}, at: "S03.start+1.8", anchor: peak, gain_offset_db: -2}
        - {synth: air, params: {duration: 0.7, peak_at: 0.85}, at: "S06.start", anchor: peak, gain_offset_db: -2}
      duck: {depth_db: 4, attack: 0.01, release: 0.3, threshold_db: -42}
      pan_max: 0.3
      room_tone: {sample: room_tone_30s, level_db: -48}
      master: {lufs: -14, true_peak: -1.5, comp_ratio: 1.5}
    export: {output: ../../odsluch/RYTM_robocza_30s_16x9.mp4, crf: 23, preset: medium, audio_bitrate: 192k}
