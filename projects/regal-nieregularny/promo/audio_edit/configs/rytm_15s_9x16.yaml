# RYTM - cutdown 9:16, 15,00 s = 375 kl. (research-brief.md 8.1), wylacznie z renderow 2560x1440.
# Kolumna 810x1440 -> 1080x1920, cx kluczowany per ujecie; unsharp 5:5:0.4 po upscalu.
#   python3 edit.py configs/rytm_15s_9x16.yaml [--draft]
work_dir: ../test/work      # posrednie FFV1 (katalog test/ jest w .gitignore)
versions:
  rytm_15s_9x16:
    size: [1080, 1920]
    fps: 25
    sharpen: true
    shots:
      - {id: V1, src: ../../frames/S01/f_####.png, f: [0, 60], cx: 0.45}
      - {id: V2, src: ../../frames/S03/f_####.png, f: [180, 225], cx: [[0, 0.50], [1.2, 0.46], [1.8, 0.47]]}
      - {id: V3, src: ../../frames/S04/f_####.png, f: [255, 300], cx: 0.50}
      - {id: V4, src: ../../frames/S07/f_####.png, f: [450, 480], cx: 0.50}
      - {id: V5, src: ../../frames/S08/f_####.png, f: [480, 600], cx: [0.50, 0.505]}
      - id: V6
        type: endcard
        dur_f: 75
        f: [660, 735]                                 # okno zdarzen: sting RYTM f660 -> 12,0 s
        bg: "#EFEAE2"
        elements:
          - {type: glyph, model: ../../data/model.json, height: 400, cx: 540, cy: 560, stroke: 3, f: [2, 32]}
          - {type: text, text: RYTM, style: end_name, x: 540, y: 900, f: [10, 24]}
          - {type: text, text: "Precyzja w każdej warstwie.", style: end_tag, x: 540, y: 990, f: [18, 32]}
          - {type: text, text: "Regał ze sklejki brzozowej\n190 × 202 × 40 cm", style: end_desc, x: 540, y: 1060, f: [24, 36]}
          - {type: text, text: "CNC Furniture Studio", style: end_brand, x: 540, y: 1180, f: [30, 42]}
    titles:                                           # strefa bezpieczna: y 270-1250, x 65-1015
      - {text: "Bez boków.", style: title, x: 540, y: 420, align: center, f: [10, 58]}
      - {text: "Pełny wysuw.", style: title, x: 540, y: 420, align: center, f: [66, 104]}
      - {text: "Cichy domyk.", style: title, x: 540, y: 420, align: center, f: [118, 148]}
      - {text: "140 elementów.", style: title, x: 540, y: 420, align: center, f: [152, 174], glow: true}
    grade: {lut: auto, vignette: 0.09, grain: 5}
    audio:
      # ta sama muzyka co 30 s, montaz taktow: hook (od otwarcia pada) 0-4,8 | wyciszenie 4,8-7,2 (proznia 6,96-7,2)
      # | drop od 7,2 (V5 = S08) 2 takty | outro od 12,0 (plansza)
      music:
        file: ../music/fal_eleven25_nordic_marimba_s11_30s_20261031-022335_48k.wav
        lufs: -18
        edit:
          - {src_in: 2.4, src_out: 7.2, at: 0.0}
          - {src_in: 19.18, src_out: 21.6, at: 4.78, xfade: 0.02}
          - {src_in: 21.58, src_out: 26.4, at: 7.18, xfade: 0.02}
          - {src_in: 26.38, src_out: 30.0, at: 11.98, xfade: 0.02}
      event_notes: true
      event_music_fx: true
      events: ../../renders/events.json               # zdarzenia przeliczane per ujecie (np. f480 -> 7,2 s)
      duck: {depth_db: 4, attack: 0.01, release: 0.3, threshold_db: -42}
      # proznia 6,96-7,2 s przychodzi z events.json (silence f474-480 w oknie V4)
      pan_max: 0.15
      room_tone: {sample: room_tone_30s, level_db: -48}
      master: {lufs: -14, true_peak: -1.5, comp_ratio: 1.5}
    export: {output: ../out/rytm_15s_9x16.mp4, crf: 17, preset: slow}
